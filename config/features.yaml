  # =========================
  # STRUCTURE
  # =========================

  - name: multiple_seasons
    category: structure
    question: "Does it have multiple seasons?"
    source: number_of_seasons
    condition: ">1"

  - name: ongoing
    category: structure
    question: "Is it still ongoing?"
    source: status
    value: Returning Series

  - name: long_series
    category: structure
    question: "Is it a long-running series?"
    source: number_of_episodes
    condition: ">50"